<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IT Asset Management - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container" style="display: flex; align-items: center; justify-content: center; height: calc(100vh - 64px);">
    <div class="card" style="width: 100%; max-width: 400px; padding: 2.5rem;">
        <h2 style="font-family: 'Syne'; text-align: center; margin-bottom: 1.5rem;">System Login</h2>
        <form id="loginForm" action="/perform_login" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Authenticate</button>
        </form>
        <p id="error-msg" style="color: var(--danger); font-size: 0.8rem; text-align: center; margin-top: 1rem;"></p>
        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="register.html" style="color: var(--muted); font-size: 0.85rem; text-decoration: none;">New here? Create Account</a>
        </div>
    </div>
</div>
<script src="login.js"></script>
</body>
</html>
