<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>User Dashboard | IT Asset Management</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<nav class="navbar">
    <div class="nav-logo">
        <h2 class="nav-logo-text">AssetCore <span>User</span></h2>
    </div>
    <button class="btn" id="logoutBtn" style="background: var(--danger)">Logout</button>
</nav>

<main class="dashboard" style="padding: 2rem;">
    <h3 style="font-family: 'Syne'; margin-bottom: 2rem;">Workspace Overview</h3>

    <div class="cards" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
        <div class="card">
            <h4 style="color: var(--accent)">Available Assets</h4>
            <p style="color: var(--muted); font-size: 0.9rem; margin: 10px 0;">Browse and request new hardware.</p>
            <a href="view-available-assets.html" class="btn">View Catalog</a>
        </div>

        <div class="card">
            <h4 style="color: var(--accent2)">My Inventory</h4>
            <p style="color: var(--muted); font-size: 0.9rem; margin: 10px 0;">Manage your assigned items.</p>
            <a href="my-assets.html" class="btn">View My Items</a>
        </div>
    </div>
</main>
<script src="script.js"></script>
</body>
</html>
